name: Windows build (host-only)

# Best-effort Windows CI: configures and builds tt-umd with MSVC through the fork's
# Windows overlay (windows/cmake/msvc-cache.cmake), then runs the host-only test
# binaries (no Tenstorrent hardware present on GitHub-hosted runners).
on:
  push:
    branches:
      - windows-v2
  workflow_dispatch:

jobs:
  windows-msvc-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environment info
        id: env_info
        shell: pwsh
        run: |
          cmake --version
          Get-Command cmake | Format-List
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "vswhere installationPath: $vsPath"
          "vs_path=$vsPath" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows overlay, Ninja generator)
        id: configure
        shell: pwsh
        continue-on-error: true
        run: |
          # The initial-cache file turns on the overlay (CMAKE_PROJECT_umd_INCLUDE) and sets the
          # supported options; no upstream CMake file is edited. Ninja with cl.exe/link.exe from
          # ilammy/msvc-dev-cmd, so the job does not depend on the runner's Visual Studio version.
          cmake -S . -B .build/windows-msvc -G Ninja `
            -C windows/cmake/msvc-cache.cmake `
            -DTT_UMD_BUILD_TESTS=ON `
            2>&1 | Tee-Object -FilePath configure.log
          exit $LASTEXITCODE

      - name: Report configure failure
        if: steps.configure.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = Get-Content configure.log -Tail 60
          foreach ($line in $lines) {
            $escaped = $line -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error::$escaped"
          }
          exit 1

      - name: Build (Release)
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build .build/windows-msvc 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          # Ninja runs many object files in parallel, so the actual compiler error for the file
          # that failed is often scrolled off by unrelated warnings from files that finished
          # compiling afterwards. Grep for real MSVC diagnostics (": error C####:") plus a few
          # lines of surrounding context first; only fall back to a plain tail if none are found.
          $all = Get-Content build.log
          $errorLines = $all | Select-String -Pattern ': error [A-Z]+\d+:'
          if ($errorLines) {
            $lines = @()
            foreach ($m in $errorLines) {
              $start = [Math]::Max(0, $m.LineNumber - 3)
              $end = [Math]::Min($all.Count - 1, $m.LineNumber + 1)
              $lines += $all[$start..$end]
              $lines += ""
            }
          } else {
            $lines = Get-Content build.log -Tail 80
          }
          foreach ($line in $lines) {
            $escaped = $line -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error::$escaped"
          }
          exit 1

      - name: Test filter (windows/tests/gtest_exclude.txt)
        id: filter
        shell: bash
        run: |
          patterns=$(grep -v '^\s*#' windows/tests/gtest_exclude.txt | tr -d '\r' | grep -v '^\s*$' | paste -sd: -)
          echo "gtest_filter=-${patterns}" >> "$GITHUB_OUTPUT"

      - name: Run umd_misc_tests (host-only)
        run: .build/windows-msvc/test/umd/misc/umd_misc_tests.exe --gtest_filter="${{ steps.filter.outputs.gtest_filter }}"
        shell: bash

      - name: Run baremetal_tests (host-only)
        run: .build/windows-msvc/test/umd/baremetal/baremetal_tests.exe --gtest_filter="${{ steps.filter.outputs.gtest_filter }}"
        shell: bash

      - name: Run api_tests simulation-sysmem subset (host-only)
        run: .build/windows-msvc/test/umd/api/api_tests.exe --gtest_filter="ApiSimulationSysmemManager.*"
        shell: bash
